{% extends "base.html" %}
{% block title %}카테고리 목록 - DHO 아카이브 미러{% endblock %}
{% block breadcrumb_bar %}{% endblock %}
{% block content %}
  {% for group in groups %}
    <section class="card category-group">
      <header class="card-head">
        <h2>{{ group.title }}</h2>
      </header>
      <ul class="category-grid">
        {% for c in group.categories %}
          <li>
            <a href="{{ url_for('category_list', category=c.slug) }}">
              {{ c.label }}
            </a>
            <span class="count">{{ c.cnt }}</span>
          </li>
        {% endfor %}
      </ul>
    </section>
  {% endfor %}
{% endblock %}
